<body>
    <main class="auth-page">
        <section class="auth-left">
            <div class="auth-content">
                <a href="index.html" class="logo">
                    <img src="https://www.f-cdn.com/assets/main/en/assets/freelancer-logo.svg" alt="Freelancer">
                </a>
                <h1>Welcome back</h1>
                <div class="social-buttons">
                    <button class="social-btn">
                        <span class="google-icon">G</span>
                        <span>Continue with Google</span>
                    </button>
                    <button class="social-btn">
                        <span class="facebook-icon">f</span>
                        <span>Continue with Facebook</span>
                    </button>
                </div>

                <div class="divider">
                    <span>OR</span>
                </div>

                <form>
                    <div class="input-group">
                        <input type="text" id="email" placeholder="Email or Username" required>
                    </div>
                    <div class="input-group password-group">
                        <input type="password" id="password" placeholder="Password" required>
                        <button type="button" class="eye-button">
                            <span>◉</span>
                        </button>
                    </div>
                    <div class="login-options">
                        <label class="remember">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button class="login-btn" type="submit">
                        Log in
                    </button>
                </form>

                <div class="bottom-divider"></div>

                <p class="account-text">
                    Don't have an account?
                    <a href="signup.html">Sign up</a>
                </p>

                <div class="app-buttons">
                    <div class="app">
                        <a href="">
                            <img src="https://www.f-cdn.com/assets/main/en/assets/footer/app-store.svg"
                                alt="Download on the App Store">
                        </a>
                    </div>
                    <div class="app">
                        <a href="">
                            <img src="https://www.f-cdn.com/assets/main/en/assets/footer/google-play.svg"
                                alt="Get it on Google Play">
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="auth-right">
            <img class="bird-image" src="https://www.f-cdn.com/assets/main/en/assets/job-post/redesign/bird.jpg" alt="">
            <img class="make-it-real"
                src="https://www.f-cdn.com/assets/main/en/assets/job-post/redesign/make-it-real.png" alt="Make it real">
        </section>
    </main>
</body>
